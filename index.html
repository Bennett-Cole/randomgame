<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Shooter Arcade Pro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <div class="hud">
      <div class="hud-item">SCORE: <span id="score-val">0</span></div>
      <div class="hud-item">SHIELD: <span id="shield-val">100</span>%</div>
    </div>
    <canvas id="gameCanvas" width="640" height="360"></canvas>
    <div class="controls-hint">Use Left/Right Arrow or Mouse to Move Spacecraft</div>
  </div>
  <script src="game.js"></script>
</body>
</html>
